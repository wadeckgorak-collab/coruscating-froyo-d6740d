<g transform="translate(480 0)"><circle cx="34" cy="34" r="34" fill="#ffffff" fill-opacity=".14"/><text x="82" y="24" font-size="26" font-weight="800">UNE AVENTURE</text><text x="82" y="58" font-size="24">HUMAINE</text></g>
<g transform="translate(900 0)"><circle cx="34" cy="34" r="34" fill="#ffffff" fill-opacity=".14"/><text x="82" y="24" font-size="26" font-weight="800">AU CŒUR DE</text><text x="82" y="58" font-size="24">L’OUVERTURE DE LA STATION</text></g>
</g>
<rect x="42" y="42" width="1516" height="816" rx="30" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
