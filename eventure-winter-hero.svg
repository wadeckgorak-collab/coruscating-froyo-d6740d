<text x="3" y="354" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="8">DU 11 AU 13 DÉCEMBRE 2026</text>
<rect x="0" y="390" width="112" height="9" rx="5" fill="#ff641f"/>
<text x="0" y="472" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700">Un week-end à la montagne</text>
<text x="0" y="525" font-family="Arial,Helvetica,sans-serif" font-size="42">entre événement et temps libre</text>
