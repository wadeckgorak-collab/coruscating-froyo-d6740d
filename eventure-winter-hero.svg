<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Winter Trail Pra Loup</title><desc id="d">Du 11 au 13 décembre 2026, un week-end à la montagne entre événement et temps libre.</desc>
<defs>
<linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2b" stop-opacity=".92"/><stop offset=".46" stop-color="#071a2b" stop-opacity=".42"/><stop offset="1" stop-color="#071a2b" stop-opacity=".08"/></linearGradient>
<linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071a2b" stop-opacity="0"/><stop offset="1" stop-color="#071a2b" stop-opacity=".75"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="22" flood-opacity=".22"/></filter>
</defs>
<rect width="1600" height="900" rx="38" fill="#dfeaf2"/>
