<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventure — Prototype V7</title><meta name="theme-color" content="#17261f"><style>
:root{--ink:#172019;--muted:#6f786f;--bg:#f1f4ef;--card:#fff;--accent:#91c83e;--accent2:#244f3c;--line:#dde4db;--soft:#edf5e6;--free:#eef8df}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:460px;margin:auto;min-height:100vh;background:#fafbfa}.top{position:sticky;top:0;z-index:5;background:#fafbfaf2;backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid var(--line)}.toprow,.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.brand{font-weight:950;letter-spacing:-1.3px;font-size:26px}.brand span{color:var(--accent)}.mode{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;font-size:12px;color:var(--accent2)}main{padding:16px 16px 32px}.screen{display:none}.screen.active{display:block}h1{font-size:29px;line-height:1.03;letter-spacing:-1px;margin:8px 0 10px}h2{font-size:20px;margin:12px 0}.meta,small{font-size:12px;color:var(--muted)}.card,.section{background:#fff;border:1px solid var(--line);border-radius:18px;margin:12px 0;box-shadow:0 7px 20px #00000008}.section{padding:16px}.card{overflow:hidden}.photo{height:170px;background:linear-gradient(180deg,#0000,#1119),url('card-trail.jpg') center/cover;padding:14px;color:#fff;display:flex;align-items:flex-end;font-weight:850}.body{padding:15px}.btn{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:850;padding:13px;margin-top:10px}.btn.alt{background:#fff;color:var(--accent2);border:1px solid var(--accent2)}.btn.dark{background:var(--accent2)}.btn.mini{width:auto;margin:0;padding:8px 11px}.back{border:0;background:none;color:var(--accent2);font-weight:850;padding:0}.perk{display:inline-block;border:1px solid #dfead5;background:var(--soft);border-radius:999px;padding:6px 9px;font-size:12px;margin:3px 4px 3px 0}.statusBadge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;margin-left:6px}.status-obligatoire{background:#ffe7e3;border:1px solid #f0b6ae;color:#8f3328}.status-recommande{background:#fff5d8;border:1px solid #f0d98c;color:#795f12}.status-optionnel{background:#edf5e6;border:1px solid #cfe1bc;color:#315b31}.stat{flex:1;text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px 5px;background:#fff}.stat b{display:block;font-size:22px;color:var(--accent2)}.createHero{background:linear-gradient(135deg,#244f3c,#173225);color:#fff;border-radius:22px;padding:18px;margin:10px 0 18px}.createHero .meta{color:#d9e8df}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:5px;background:#fff}.small{font-size:12px;color:var(--muted);display:block;margin-top:12px}.need{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fbfcfb}.stepbar{display:flex;gap:5px;margin:10px 0 16px}.stepbar span{height:5px;flex:1;border-radius:5px;background:#dfe4de}.stepbar span.on{background:var(--accent)}.eventCard{cursor:pointer}.draftBadge{background:#fff5d8;border:1px solid #f0d98c;border-radius:999px;padding:5px 8px;font-size:11px}.publishedBadge{background:var(--soft);border:1px solid #cfe1bc;border-radius:999px;padding:5px 8px;font-size:11px}.photoPreview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.photoPreview img{width:100%;height:92px;object-fit:cover;border-radius:10px}.galleryHero{width:100%;height:230px;object-fit:cover;border-radius:16px}.saveNote{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}.tip{background:#f3f8ed;border:1px solid #d7e7c6;border-radius:14px;padding:12px;margin:12px 0}.tip b{color:var(--accent2)}.freeBlock{background:var(--free);border:1px solid #d4e9b6;border-radius:12px;padding:10px;margin-top:8px}.missionBlock{background:#f7f7f7;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.dayTitle{font-weight:900;margin-top:12px}.empty{padding:18px;text-align:center;color:var(--muted)}
</style></head><body><div class="app"><header class="top"><div class="toprow"><div class="brand">EVENT<span>URE</span></div><button class="mode" id="modeBtn" onclick="toggleMode()">Organisateur</button></div></header><main>
<section id="discover" class="screen active"><h1>Découvrir</h1><div id="discoverList"></div><button class="btn dark" onclick="go('org')">Passer en mode organisateur</button></section>
<section id="org" class="screen"><div class="row"><div><div class="meta">MODE ORGANISATEUR</div><h1>Mes événements</h1></div><button class="btn mini" onclick="startCreate()">＋ Créer</button></div><div class="createHero"><h2 style="margin-top:0">Créer un nouvel événement</h2><p class="meta">Définis ton événement, tes missions, les temps de travail et surtout les temps libres qui donnent envie de participer.</p><button class="btn" onclick="startCreate()">Créer mon événement</button></div><div id="savedDraft"></div><div id="orgEvents"></div></section>
<section id="eventDetail" class="screen"><button class="back" onclick="go('org')">← Mes événements</button><div id="eventDetailContent"></div></section>
<section id="publicDetail" class="screen"><button class="back" onclick="go('discover')">← Découvrir</button><div id="publicDetailContent"></div></section>
<section id="create" class="screen"><button class="back" onclick="saveDraft();go('org')">← Mes événements</button><h1 id="createTitle">Créer un événement</h1><div class="stepbar" id="stepbar"><span class="on"></span><span></span><span></span><span></span><span></span></div><div id="createStep"></div><div class="saveNote">Toutes les modifications sont sauvegardées automatiquement sur cet appareil.</div></section>
</main></div><script>
const defaultEvent={id:'trail-neiges',name:'Trail des Neiges',type:'Trail / Running',place:'Le Sauze',dates:'18–20 décembre',status:'Publié',total:20,applications:186,confirmed:7,photos:[],needs:[{name:'Terrain / signaleurs',qty:10},{name:'Départ / arrivée',qty:5},{name:'Dossards / accueil',qty:5}],hours:{0:{Vendredi:'14h-18h',Samedi:'10h30-20h',Dimanche:'9h-11h'},1:{Samedi:'15h-20h'},2:{Samedi:'11h-12h'}},housing:'Hôtel twin · 2 nuits',meals:'Repas mission + soirée équipe',access:'Accès domaine skiable',equipment:'Matériel selon mission',transport:'Covoiturage / mobilité équipe',social:'Welcome party vendredi · présentation de l’équipe et briefing général',socialStatus:'Obligatoire',social2:'Soirée équipe samedi · dîner / moment convivial',social2Status:'Optionnel',welcomeBag:'Produits partenaires',other1:'',other2:''};
const blank=()=>({id:null,name:'',type:'Trail / Running',place:'',dates:'',total:20,photos:[],needs:[{name:'Terrain / signaleurs',qty:10},{name:'Départ / arrivée',qty:5},{name:'Dossards / accueil',qty:5}],hours:{},housing:'',meals:'',access:'',equipment:'',transport:'',social:'',socialStatus:'Optionnel',social2:'',social2Status:'Optionnel',welcomeBag:'',other1:'',other2:'',status:'Brouillon',applications:0,confirmed:0});
let draft=loadDraft()||blank(),createStep=1,editingId=null;
function esc(v=''){return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function getEvents(){try{const a=JSON.parse(localStorage.getItem('eventureEvents')||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function setEvents(a){localStorage.setItem('eventureEvents',JSON.stringify(a))}
function normalizeEvent(e){return {...blank(),...e,socialStatus:e.socialStatus||'Optionnel',social2Status:e.social2Status||'Optionnel'}}
function allEvents(){const a=getEvents();return [normalizeEvent(defaultEvent),...a.filter(e=>e.id!==defaultEvent.id).map(normalizeEvent)]}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='org'){renderSavedDraft();renderOrgEvents()}if(id==='discover')renderDiscover();document.getElementById('modeBtn').textContent=id==='discover'||id==='publicDetail'?'Organisateur':'Eventurer';window.scrollTo({top:0,behavior:'smooth'})}
function toggleMode(){const active=document.querySelector('.screen.active')?.id;go(active==='discover'||active==='publicDetail'?'org':'discover')}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem('eventureDraft'));return d?normalizeEvent(d):null}catch(e){return null}}
function saveDraft(){localStorage.setItem('eventureDraft',JSON.stringify(draft));renderSavedDraft()}
function setD(k,v){draft[k]=v;saveDraft()}
function setNeed(i,k,v){draft.needs[i][k]=k==='qty'?Number(v):v;saveDraft()}
function setHour(i,d,v){draft.hours[i]=draft.hours[i]||{};draft.hours[i][d]=v;saveDraft()}
function renderSavedDraft(){const d=loadDraft(),el=document.getElementById('savedDraft');if(!el)return;if(!d||d.status==='Publié'||(!d.name&&!d.place&&!d.dates)){el.innerHTML='';return}el.innerHTML=`<div class="section eventCard" onclick="resumeDraft()"><div class="row"><div><b>${esc(d.name||'Événement sans nom')}</b><div class="meta">${esc(d.dates||'Dates à compléter')} · ${esc(d.place||'Lieu à compléter')}</div></div><span class="draftBadge">Brouillon</span></div><p class="meta">Création en cours. Tes informations restent disponibles tant que tu ne les remplaces pas par un nouveau brouillon.</p><button class="btn alt">Reprendre / modifier</button></div>`}
function startCreate(){draft=blank();editingId=null;saveDraft();createStep=1;document.getElementById('createTitle').textContent='Créer un événement';go('create');renderCreate()}
function resumeDraft(){draft=loadDraft()||blank();editingId=draft.id||null;createStep=1;document.getElementById('createTitle').textContent=editingId?'Modifier l’événement':'Modifier le brouillon';go('create');renderCreate()}
function editEvent(id){const e=allEvents().find(x=>x.id===id);if(!e)return;draft=JSON.parse(JSON.stringify(e));editingId=id;saveDraft();createStep=1;document.getElementById('createTitle').textContent='Modifier l’événement';go('create');renderCreate()}
function imgStyle(e){return e.photos?.[0]?`style="background-image:linear-gradient(180deg,#0000,#1119),url('${e.photos[0]}')"`:''}
function statusClass(s){return s==='Obligatoire'?'status-obligatoire':s==='Recommandé'?'status-recommande':'status-optionnel'}
function socialHTML(e){const moments=[[e.social,e.socialStatus],[e.social2,e.social2Status]].filter(x=>x[0]);if(!moments.length)return'<p class="meta">Aucun moment collectif renseigné.</p>';return moments.map(x=>`<div class="need"><div><b>🎉 ${esc(x[0])}</b><span class="statusBadge ${statusClass(x[1])}">${esc(x[1])}</span></div>${x[1]==='Optionnel'?'<div class="meta" style="margin-top:6px">Participation libre : tu peux choisir de venir ou de profiter de ton temps autrement.</div>':x[1]==='Recommandé'?'<div class="meta" style="margin-top:6px">Participation conseillée pour profiter pleinement de l’expérience, sans caractère obligatoire.</div>':'<div class="meta" style="margin-top:6px">Ce moment fait partie du cadre de l’organisation (briefing, rencontre ou information nécessaire).</div>'}</div>`).join('')}
function renderOrgEvents(){const el=document.getElementById('orgEvents'),items=allEvents();el.innerHTML=items.map(e=>`<div class="card eventCard" onclick="openEvent('${e.id}')"><div class="photo" ${imgStyle(e)}>${esc((e.place||'LIEU').toUpperCase())}</div><div class="body"><div class="row"><div><b>${esc(e.name)}</b><div class="meta">${esc(e.dates)} · ${esc(e.place)}</div></div><span class="publishedBadge">Publié</span></div><div class="row" style="margin-top:12px"><div class="stat"><b>${e.total||0}</b><small>recherchés</small></div><div class="stat"><b>${e.applications||0}</b><small>candidatures</small></div><div class="stat"><b>${e.confirmed||0}</b><small>confirmés</small></div></div></div></div>`).join('')}
function renderDiscover(){const el=document.getElementById('discoverList'),items=allEvents();el.innerHTML=items.length?items.map(e=>`<div class="card eventCard" onclick="openPublic('${e.id}')"><div class="photo" ${imgStyle(e)}>${esc((e.place||'LIEU').toUpperCase())}</div><div class="body"><b>${esc(e.name)}</b><div class="meta">${esc(e.dates)} · ${e.total||0} Eventurers recherchés</div>${e.housing?'<span class="perk">🏨 Hébergement</span>':''}${e.meals?'<span class="perk">🍴 Repas</span>':''}<span class="perk">🌿 Temps libre</span>${e.social||e.social2?'<span class="perk">🎉 Moments équipe</span>':''}</div></div>`).join(''):'<div class="empty">Aucun événement publié pour le moment.</div>'}
function provisions(e){return [['🏨',e.housing],['🍴',e.meals],['🎿',e.access],['🧰',e.equipment],['🚐',e.transport],['🎁',e.welcomeBag],['✨',e.other1],['ℹ️',e.other2]].filter(x=>x[1])}
function openEvent(id){const e=allEvents().find(x=>x.id===id);if(!e)return;document.getElementById('eventDetailContent').innerHTML=`${e.photos?.[0]?`<img class="galleryHero" src="${e.photos[0]}">`:''}<div class="row" style="margin-top:10px"><div><h1>${esc(e.name)}</h1><div class="meta">${esc(e.dates)} · ${esc(e.place)}</div></div><span class="perk">Publié</span></div><div class="row"><div class="stat"><b>${e.total||0}</b><small>bénévoles recherchés</small></div><div class="stat"><b>${e.applications||0}</b><small>candidatures</small></div><div class="stat"><b>${e.confirmed||0}</b><small>confirmés</small></div></div><div class="section"><b>Besoins bénévoles</b>${e.needs.map(n=>`<div class="need"><div class="row"><span>${esc(n.name)}</span><b>${n.qty} pers.</b></div></div>`).join('')}</div><div class="section"><b>Planning & temps libre</b>${scheduleHTML(e)}</div><div class="section"><b>Moments collectifs</b>${socialHTML(e)}</div><div class="section"><b>Ce qui est mis à disposition</b><p>${provisions(e).map(x=>`${x[0]} ${esc(x[1])}`).join('<br>')||'À compléter'}</p></div><div class="section"><b>Gestion</b><button class="btn">Voir les candidatures</button><button class="btn alt">Gérer l'équipe & les affectations</button><button class="btn alt" onclick="event.stopPropagation();editEvent('${id}')">Modifier l'événement publié</button></div>`;go('eventDetail')}
function openPublic(id){const e=allEvents().find(x=>x.id===id);if(!e)return;document.getElementById('publicDetailContent').innerHTML=`${e.photos?.[0]?`<img class="galleryHero" src="${e.photos[0]}">`:''}<h1>${esc(e.name)}</h1><div class="meta">${esc(e.dates)} · ${esc(e.place)}</div>${e.photos?.length>1?`<div class="photoPreview">${e.photos.slice(1).map(p=>`<img src="${p}">`).join('')}</div>`:''}<div class="section"><b>🌿 Ton temps libre fait partie de l’expérience</b><p class="meta">Les créneaux sans mission sont affichés automatiquement pour que tu voies quand tu peux profiter du lieu, de la station ou des activités.</p>${scheduleHTML(e)}</div><div class="section"><b>🎉 Moments collectifs</b><p class="meta">Chaque moment est clairement indiqué comme obligatoire, recommandé ou optionnel pour que tu saches exactement ce qui est attendu.</p>${socialHTML(e)}</div><div class="section"><b>Missions proposées</b>${e.needs.map(n=>`<div class="need"><div class="row"><span>${esc(n.name)}</span><b>${n.qty} pers.</b></div></div>`).join('')}</div><div class="section"><b>Ce qui est mis à disposition</b><p>${provisions(e).map(x=>`${x[0]} ${esc(x[1])}`).join('<br>')||'À compléter'}</p></div><button class="btn">Je suis intéressé(e)</button>`;go('publicDetail')}
function step(n){saveDraft();createStep=n;renderCreate();window.scrollTo({top:0,behavior:'smooth'})}
function addNeed(){draft.needs.push({name:'Nouvelle mission',qty:1});saveDraft();renderCreate()}
function removeNeed(i){draft.needs.splice(i,1);saveDraft();renderCreate()}
function compressPhoto(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};img.src=r.result};r.readAsDataURL(file)}
function addPhotos(inp){const files=[...inp.files].slice(0,6-draft.photos.length);files.forEach(f=>compressPhoto(f,data=>{draft.photos.push(data);saveDraft();renderCreate()}))}
function removePhoto(i){draft.photos.splice(i,1);saveDraft();renderCreate()}
function publishEvent(){if(!draft.name.trim()){alert('Ajoute au minimum un nom à ton événement.');step(1);return}let arr=getEvents(),id=editingId||draft.id||('evt-'+Date.now());const published={...draft,id,status:'Publié',applications:draft.applications||0,confirmed:draft.confirmed||0};arr=arr.filter(e=>e.id!==id);if(id===defaultEvent.id){Object.assign(defaultEvent,published)}else arr.unshift(published);setEvents(arr);draft=JSON.parse(JSON.stringify(published));editingId=id;localStorage.setItem('eventureDraft',JSON.stringify(draft));alert('Événement enregistré et publié');renderOrgEvents();renderDiscover();go('org')}
function parseRange(v){if(!v)return null;const s=v.toLowerCase().replace(/\s/g,'').replace(/[–—]/g,'-').replace(/h/g,':');const m=s.match(/(\d{1,2})(?::(\d{2}))?-(\d{1,2})(?::(\d{2}))?/);if(!m)return null;return [+m[1]*60+(+m[2]||0),+m[3]*60+(+m[4]||0)]}
function fmt(min){const h=Math.floor(min/60),m=min%60;return m?`${h}h${String(m).padStart(2,'0')}`:`${h}h`}
function mergeRanges(r){r=r.filter(Boolean).sort((a,b)=>a[0]-b[0]);const out=[];r.forEach(x=>{const last=out[out.length-1];if(last&&x[0]<=last[1])last[1]=Math.max(last[1],x[1]);else out.push([...x])});return out}
function freeRanges(e,day){const ranges=mergeRanges(e.needs.map((_,i)=>parseRange((e.hours?.[i]||{})[day]||'')));if(!ranges.length)return [];const start=8*60,end=22*60,out=[];let cur=start;ranges.forEach(r=>{const a=Math.max(start,r[0]),b=Math.min(end,r[1]);if(a>cur)out.push([cur,a]);cur=Math.max(cur,b)});if(cur<end)out.push([cur,end]);return out.filter(x=>x[1]-x[0]>=30)}
function scheduleHTML(e){return ['Vendredi','Samedi','Dimanche'].map(day=>{const missions=e.needs.map((n,i)=>({name:n.name,time:(e.hours?.[i]||{})[day]})).filter(x=>x.time);if(!missions.length)return'';const free=freeRanges(e,day);return `<div class="dayTitle">${day}</div>${missions.map(x=>`<div class="missionBlock">🛠️ ${esc(x.time)} · ${esc(x.name)}</div>`).join('')}${free.map(x=>`<div class="freeBlock">🌿 <b>Temps libre ${fmt(x[0])}–${fmt(x[1])}</b><div class="meta">Tu es libre de profiter du lieu, des infrastructures ou des activités disponibles.</div></div>`).join('')}`}).join('')||'<p class="meta">Horaires à compléter.</p>'}
function renderCreate(){document.querySelectorAll('#stepbar span').forEach((s,i)=>s.classList.toggle('on',i<createStep));const el=document.getElementById('createStep');if(createStep===1)el.innerHTML=`<div class="section"><b>1 · Ton événement</b><label class="small">Nom</label><input class="field" value="${esc(draft.name)}" oninput="setD('name',this.value)" placeholder="Ex. Trail des Neiges"><label class="small">Type</label><select class="field" onchange="setD('type',this.value)">${['Trail / Running','Ski / Freeride','Vélo','Festival / Culture','Associatif / Solidarité','Institutionnel','Autre'].map(x=>`<option ${draft.type===x?'selected':''}>${x}</option>`).join('')}</select><label class="small">Lieu</label><input class="field" value="${esc(draft.place)}" oninput="setD('place',this.value)" placeholder="Ex. Le Sauze"><label class="small">Dates</label><input class="field" value="${esc(draft.dates)}" oninput="setD('dates',this.value)" placeholder="Ex. 18–20 décembre"><label class="small">Photos de l’événement</label><input class="field" type="file" accept="image/*" multiple onchange="addPhotos(this)"><div class="meta">Jusqu’à 6 photos. Elles sont optimisées automatiquement pour éviter de saturer le stockage du téléphone.</div>${draft.photos.length?`<div class="photoPreview">${draft.photos.map((p,i)=>`<div><img src="${p}"><button class="back" onclick="removePhoto(${i})">Supprimer</button></div>`).join('')}</div>`:''}<button class="btn" onclick="step(2)">Continuer</button></div>`;
if(createStep===2)el.innerHTML=`<div class="section"><b>2 · Besoins bénévoles</b><label class="small">Nombre total recherché</label><input class="field" type="number" value="${draft.total}" oninput="setD('total',Number(this.value))"><p class="meta">Les intitulés proposés sont des exemples : chaque poste reste entièrement personnalisable.</p><datalist id="missions"><option value="Balisage"><option value="Accueil"><option value="Gestion parcours sportif"><option value="Gestion coureurs"><option value="Dossards"><option value="Signaleurs"><option value="Logistique"><option value="Ravitaillement"><option value="Montage / démontage"><option value="Photo / vidéo"></datalist>${draft.needs.map((n,i)=>`<div class="need"><label class="small">Intitulé du poste / mission</label><input class="field" list="missions" value="${esc(n.name)}" oninput="setNeed(${i},'name',this.value)" placeholder="Écris librement l’intitulé"><label class="small">Nombre de personnes</label><input class="field" type="number" value="${n.qty}" oninput="setNeed(${i},'qty',this.value)"><button class="btn alt" onclick="removeNeed(${i})">Supprimer ce besoin</button></div>`).join('')}<button class="btn alt" onclick="addNeed()">＋ Ajouter un poste personnalisé</button><button class="btn" onclick="step(3)">Définir les horaires</button></div>`;
if(createStep===3)el.innerHTML=`<div class="section"><b>3 · Horaires, missions & temps libre</b><div class="tip"><b>🌿 Important : le temps libre est un vrai avantage.</b><p class="meta">Les bénévoles ne viennent pas seulement pour travailler : ils viennent aussi vivre l’événement et profiter du lieu. Indique précisément les heures de mission. Eventure calculera automatiquement les plages libres restantes entre 8h et 22h et les affichera clairement dans l’annonce.</p></div><p class="meta">Exemple : si « Dossards » = 11h–12h, Eventure affichera automatiquement du temps libre avant et après ce créneau sur la journée.</p>${draft.needs.map((n,i)=>`<div class="need"><b>${esc(n.name)}</b>${['Vendredi','Samedi','Dimanche'].map(d=>`<label class="small">${d}</label><input class="field" value="${esc((draft.hours[i]||{})[d]||'')}" oninput="setHour(${i},'${d}',this.value)" placeholder="Ex. 11h-12h">`).join('')}</div>`).join('')}<div class="tip"><b>Aperçu automatique du temps libre</b>${scheduleHTML(draft)}</div><button class="btn" onclick="step(4)">Définir ce qui est mis à disposition</button></div>`;
if(createStep===4)el.innerHTML=`<div class="section"><b>4 · Expérience bénévole</b><p class="meta">Décris concrètement les moyens mis à disposition et ce qui rend l’expérience attractive.</p>${[['housing','Hébergement','Ex. Hôtel twin · 2 nuits'],['meals','Repas','Ex. repas mission + soirée équipe'],['access','Forfait / accès / activité','Ex. accès domaine skiable'],['equipment','Matériel','Ex. matériel selon mission'],['transport','Transport / covoiturage','Ex. navettes ou covoiturage organisé']].map(x=>`<label class="small">${x[1]}</label><textarea class="field" rows="2" oninput="setD('${x[0]}',this.value)" placeholder="${x[2]}">${esc(draft[x[0]])}</textarea>`).join('')}<div class="tip"><b>🎉 Moments collectifs : précise toujours le niveau d’engagement.</b><p class="meta">Une welcome party peut être obligatoire si elle sert de briefing et de rencontre. Une soirée festive peut être optionnelle. Le bénévole doit savoir immédiatement ce qui est attendu et ce qui reste totalement libre.</p></div><label class="small">Moment collectif 1</label><textarea class="field" rows="2" oninput="setD('social',this.value)" placeholder="Ex. Welcome party vendredi 19h · rencontre + briefing">${esc(draft.social)}</textarea><label class="small">Participation</label><select class="field" onchange="setD('socialStatus',this.value)">${['Obligatoire','Recommandé','Optionnel'].map(x=>`<option ${draft.socialStatus===x?'selected':''}>${x}</option>`).join('')}</select><label class="small">Moment collectif 2</label><textarea class="field" rows="2" oninput="setD('social2',this.value)" placeholder="Ex. Soirée équipe samedi · dîner / musique">${esc(draft.social2)}</textarea><label class="small">Participation</label><select class="field" onchange="setD('social2Status',this.value)">${['Obligatoire','Recommandé','Optionnel'].map(x=>`<option ${draft.social2Status===x?'selected':''}>${x}</option>`).join('')}</select>${[['welcomeBag','Welcome bag','Ex. t-shirt, goodies partenaires, produits locaux'],['other1','Autre moyen mis à disposition','Décris librement un élément supplémentaire'],['other2','Autre information utile','Ajoute une autre information pour les bénévoles']].map(x=>`<label class="small">${x[1]}</label><textarea class="field" rows="2" oninput="setD('${x[0]}',this.value)" placeholder="${x[2]}">${esc(draft[x[0]])}</textarea>`).join('')}<button class="btn" onclick="step(5)">Prévisualiser</button></div>`;
if(createStep===5)el.innerHTML=`<div class="section"><b>5 · Vérifie & publie</b><h2>${esc(draft.name||'Événement sans nom')}</h2><div class="meta">${esc(draft.dates||'Dates à compléter')} · ${esc(draft.place||'Lieu à compléter')}</div>${draft.photos.length?`<img class="galleryHero" src="${draft.photos[0]}">${draft.photos.length>1?`<div class="photoPreview">${draft.photos.slice(1).map(p=>`<img src="${p}">`).join('')}</div>`:''}`:''}<div class="need"><b>${draft.total} bénévoles recherchés</b><p>${draft.needs.map(n=>`${esc(n.name)} · ${n.qty} pers.`).join('<br>')}</p></div><div class="tip"><b>🌿 Temps libre visible automatiquement</b>${scheduleHTML(draft)}</div><div class="section"><b>🎉 Moments collectifs</b>${socialHTML(draft)}</div>${draft.welcomeBag?`<div class="need"><b>🎁 Welcome bag</b><p>${esc(draft.welcomeBag)}</p></div>`:''}<button class="btn" onclick="publishEvent()">${editingId?'Enregistrer les modifications':'Publier l’événement'}</button><button class="btn alt" onclick="step(1)">Modifier les informations</button><button class="btn alt" onclick="step(2)">Modifier les postes</button><button class="btn alt" onclick="step(3)">Modifier horaires & temps libre</button><button class="btn alt" onclick="step(4)">Modifier l’expérience bénévole</button></div>`}
